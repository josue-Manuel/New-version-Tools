  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-[#1446A0] selection:text-white">

    <script>
      // Service Worker registration for offline PWA capabilities
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.info('Service Worker registration skipped or failed:', err);
          });
        });
      }
    </script>
